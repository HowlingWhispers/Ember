name: Ember tests and syntax checks

on:
  pull_request:
  push:
    branches: [main, feature/persona-ai-one-turn-20261015]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node test suite
        run: npm test
      - name: Syntax checks
        run: npm run check
